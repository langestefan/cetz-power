# Lints the Python scripts bundled with the Claude Code skills.
line-length = 100

[lint]
# Pin the rule set explicitly: E4/E7/E9 + F catch real defects. The CI
# action tracks the latest ruff, whose *default* selection has grown to
# include style families (UP/C4/RUF/…) we deliberately don't hold the
# compact skill scripts to — an explicit select keeps the gate stable
# across ruff releases.
select = ["E4", "E7", "E9", "F"]
# The skill scripts use compact one-line statements deliberately, so
# skip the pure-style rules.
ignore = [
  "E402", # import not at top (lazy imports after argv handling)
  "E702", # multiple statements on one line
  "E731", # lambda assignment
  "E741", # ambiguous single-letter names (l, I)
]
